<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dash Cube</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0b12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; gap: 14px; background: rgba(8,7,14,0.55); backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(168,85,247,0.8); }
  .overlay p { margin: 0; font-size: 1.05rem; color: #cfc6dd; }
  .overlay .score { font-size: 1.3rem; font-weight: 700; color: #b5bdff; }
  .hint { position: absolute; top: 14px; left: 0; right: 0; text-align: center;
    color: #ffffffcc; font-size: 0.95rem; pointer-events: none; text-shadow: 0 1px 4px #000; }
  .hud { position: absolute; top: 14px; right: 18px; color: #fff; font-weight: 700;
    font-size: 1.2rem; text-shadow: 0 1px 4px #000; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud" id="hud">0</div>
  <div class="hint" id="hint">Click, tap, or press Space to jump</div>
  <div class="overlay" id="start">
    <h1>DASH CUBE</h1>
    <p>Jump the spikes. One button. Don't crash.</p>
    <p>Click / Tap / Space to start</p>
  </div>
  <div class="overlay" id="over" hidden>
    <h1>CRASHED</h1>
    <p class="score" id="finalScore">Score: 0</p>
    <p id="bestScore">Best: 0</p>
    <p>Click / Tap / Space to retry</p>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("hud");
  const hint = document.getElementById("hint");
  const startScreen = document.getElementById("start");
  const overScreen = document.getElementById("over");
  const finalScore = document.getElementById("finalScore");
  const bestScoreEl = document.getElementById("bestScore");

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);

  const COLORS = ["#8fd3ff", "#b388ff", "#ff7bd5", "#7fffb0", "#ffd166"];
  let state = "start";
  let best = 0;
  try { best = parseInt(localStorage.getItem("dashcube-best") || "0", 10) || 0; } catch (e) {}

  let groundY, player, obstacles, particles, speed, dist, spawnX, hue, shake;

  function reset() {
    resize();
    groundY = H - Math.max(70, H * 0.18);
    player = { x: W * 0.22, y: groundY, size: Math.max(26, H * 0.05), vy: 0, onGround: true, rot: 0 };
    obstacles = [];
    particles = [];
    speed = Math.max(5.2, W * 0.007);
    dist = 0;
    spawnX = W + 200;
    hue = 0;
    shake = 0;
  }

  function jump() {
    if (state === "start") { state = "play"; startScreen.hidden = true; hint.style.opacity = "0"; return; }
    if (state === "over") { restart(); return; }
    if (player.onGround) {
      player.vy = -Math.sqrt(2 * 0.9 * (player.size * 4.4));
      player.onGround = false;
    }
  }

  function restart() { reset(); state = "play"; overScreen.hidden = true; }

  function spawnObstacle() {
    const gap = 260 + Math.random() * 220 - Math.min(90, dist / 40);
    spawnX += Math.max(170, gap);
    const kind = Math.random();
    if (kind < 0.62) {
      const n = 1 + Math.floor(Math.random() * 3);
      obstacles.push({ type: "spikes", x: spawnX, n, w: 30 });
    } else if (kind < 0.85) {
      const h = player.size * (1.1 + Math.random() * 1.4);
      obstacles.push({ type: "block", x: spawnX, w: player.size * 1.1, h });
    } else {
      obstacles.push({ type: "spikes", x: spawnX, n: 2, w: 30 });
      obstacles.push({ type: "block", x: spawnX + 150, w: player.size, h: player.size * 1.6 });
      spawnX += 150;
    }
  }

  function burst(x, y) {
    for (let i = 0; i < 26; i++) {
      particles.push({
        x, y, vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 9 - 2,
        life: 1, size: 3 + Math.random() * 5, color: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
  }

  function gameOver() {
    state = "over";
    shake = 16;
    burst(player.x, player.y - player.size / 2);
    const score = Math.floor(dist / 10);
    if (score > best) { best = score; try { localStorage.setItem("dashcube-best", String(best)); } catch (e) {} }
    finalScore.textContent = "Score: " + score;
    bestScoreEl.textContent = "Best: " + best;
    overScreen.hidden = false;
  }

  function spikePoints(o) {
    const pts = [];
    for (let i = 0; i < o.n; i++) {
      const bx = o.x + i * o.w;
      pts.push([bx, groundY], [bx + o.w / 2, groundY - o.w * 1.3], [bx + o.w, groundY]);
    }
    return pts;
  }

  function hitSpike(o) {
    const p = player, half = p.size / 2;
    const left = p.x - half, right = p.x + half, bottom = p.y, top = p.y - p.size;
    for (let i = 0; i < o.n; i++) {
      const bx = o.x + i * o.w;
      const tipX = bx + o.w / 2, tipY = groundY - o.w * 1.3;
      if (right > bx + 5 && left < bx + o.w - 5 && bottom > tipY + 4) {
        const cx = Math.max(left, Math.min(tipX, right));
        if (Math.abs(cx - tipX) < o.w * 0.5 && bottom > groundY - (o.w * 1.3) * (1 - Math.abs(cx - tipX) / (o.w * 0.5))) {
          if (top < groundY) return true;
        }
      }
    }
    return false;
  }

  function update() {
    if (state !== "play") return;
    dist += speed;
    speed += 0.0018;
    hue = (hue + 0.6) % 360;

    player.vy += 0.9;
    player.y += player.vy;
    if (player.y >= groundY) { player.y = groundY; player.vy = 0; player.onGround = true; }
    player.rot += player.onGround ? 0 : 0.14;
    if (player.onGround) player.rot = Math.round(player.rot / (Math.PI / 2)) * (Math.PI / 2);

    while (spawnX < dist + W + 400) spawnObstacle();

    for (const o of obstacles) o.screenX = o.x - dist + W * 0.22 - (W * 0.22 - player.x) - 0;
    obstacles.forEach(o => { o.sx = o.x - dist; });
    obstacles = obstacles.filter(o => (o.x - dist) + 200 > 0);

    for (const o of obstacles) {
      const sx = o.x - dist;
      if (sx > W + 60 || sx < -120) continue;
      const half = player.size / 2;
      const left = player.x - half, right = player.x + half, bottom = player.y, top = player.y - player.size;
      if (o.type === "block") {
        const bl = sx, br = sx + o.w, bt = groundY - o.h;
        if (right > bl + 3 && left < br - 3) {
          if (bottom > bt + 4 && top < groundY) {
            if (player.vy >= 0 && top < bt && bottom - player.vy <= bt + 2) {
              player.y = bt; player.vy = 0; player.onGround = true;
            } else { gameOver(); }
          }
        }
      } else if (o.type === "spikes") {
        const oo = { ...o, x: sx };
        if (hitSpike(oo)) { gameOver(); }
      }
    }

    for (const p of particles) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.life -= 0.02; }
    particles = particles.filter(p => p.life > 0);
    if (shake > 0) shake *= 0.86;

    hud.textContent = Math.floor(dist / 10);
  }

  function draw() {
    ctx.save();
    if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${hue}, 45%, 12%)`);
    g.addColorStop(1, `hsl(${(hue + 60) % 360}, 50%, 6%)`);
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, H + 80);

    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    const grid = 44, off = dist % grid;
    for (let x = -off; x < W; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, groundY); ctx.stroke(); }

    ctx.fillStyle = `hsl(${hue}, 40%, 16%)`;
    ctx.fillRect(-40, groundY, W + 80, H - groundY + 40);
    ctx.strokeStyle = `hsl(${(hue + 180) % 360}, 80%, 65%)`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-40, groundY); ctx.lineTo(W + 40, groundY); ctx.stroke();

    for (const o of obstacles) {
      const sx = o.x - dist;
      if (sx > W + 60 || sx < -120) continue;
      ctx.fillStyle = "#ececf1";
      ctx.strokeStyle = `hsl(${(hue + 200) % 360}, 85%, 70%)`;
      ctx.lineWidth = 2;
      if (o.type === "spikes") {
        for (let i = 0; i < o.n; i++) {
          const bx = sx + i * o.w;
          ctx.beginPath();
          ctx.moveTo(bx, groundY);
          ctx.lineTo(bx + o.w / 2, groundY - o.w * 1.3);
          ctx.lineTo(bx + o.w, groundY);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      } else {
        ctx.fillStyle = `hsl(${(hue + 30) % 360}, 30%, 85%)`;
        ctx.fillRect(sx, groundY - o.h, o.w, o.h);
        ctx.strokeRect(sx, groundY - o.h, o.w, o.h);
      }
    }

    ctx.save();
    ctx.translate(player.x, player.y - player.size / 2);
    ctx.rotate(player.rot);
    const s = player.size;
    ctx.shadowColor = "#b5bdff"; ctx.shadowBlur = 18;
    ctx.fillStyle = "#b5bdff";
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#0c0b12";
    ctx.fillRect(-s / 2 + s * 0.22, -s / 2 + s * 0.22, s * 0.56, s * 0.56);
    ctx.restore();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }

  function onPress(e) { e.preventDefault(); jump(); }
  window.addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); } });
  canvas.addEventListener("pointerdown", onPress);

  reset();
  loop();
})();
</script>
</body>
</html>
